name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        # Compiler errors and failed tests are also shown as annotations on the run.
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: " build.log | head -20 | sed 's/^/::error::/'
            grep -E "FAILED|AssertionError|expected:" build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GymCoach.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GymCoach-apk
          path: GymCoach.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Download GymCoach.apk below and open it on your Android phone to install."
          prerelease: false
          make_latest: true
          files: GymCoach.apk
